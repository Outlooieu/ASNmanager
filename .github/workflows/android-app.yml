name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-app.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Version
        run: |
          v=$(tr -cd '0-9.' < android/VERSION)
          echo "APP_VERSION_NAME=$v" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # without the signing key (repository secrets) a debug build: installable, but every build has another key
          if [ -n "$KEYSTORE_FILE" ]; then t=release; task=assembleRelease; else t=debug; task=assembleDebug; fi
          set +e
          gradle -p android $task --no-daemon > build.log 2>&1; rc=$?
          set -e
          cat build.log
          if [ $rc -ne 0 ]; then
            # the reasons as one annotation (readable without the log)
            msg=$(grep -E 'error:|e: |What went wrong|> |Could not|FAILED|Exception' build.log | grep -v '^\s*at ' | head -n 40 | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')
            echo "::error title=Gradle build failed::$msg"
            exit 1
          fi
          echo "APK_TYPE=$t" >> "$GITHUB_ENV"
      - name: Rename
        run: |
          f=$(ls android/app/build/outputs/apk/${APK_TYPE}/*.apk | head -n 1)
          cp "$f" "ASNManager-${APP_VERSION_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ASNManager-${{ env.APP_VERSION_NAME }}
          path: ASNManager-*.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ env.APP_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: ASN Manager app ${{ env.APP_VERSION_NAME }}
          files: ASNManager-*.apk
          body: Android app for the ASN Manager WebUI. Install the APK on your phone (allow installing from this source). See android/README.md.
