plugins { id 'com.android.application' }

android {
    namespace 'de.outlooieu.asnmanager'
    compileSdk 34
    defaultConfig {
        applicationId 'de.outlooieu.asnmanager'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('APP_VERSION_CODE') ?: '1')
        versionName(System.getenv('APP_VERSION_NAME') ?: '1.0.0')
    }
    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')   // one Kotlin stdlib (security-crypto pulls an older one)
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.security:security-crypto:1.0.0'
}
